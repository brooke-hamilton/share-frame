[package]
name = "share-frame"
version = "0.1.0"
edition = "2021"
description = "Windows desktop overlay that mirrors the screen region behind it for screen-sharing."
license = "MIT"
repository = "https://github.com/brooke-hamilton/share-frame"
keywords = ["windows", "screen-share", "overlay", "win32", "gdi"]
categories = ["gui", "os::windows-apis"]
publish = false

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_Security",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = true
